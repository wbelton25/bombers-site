const KEY = 'bombers-team-pw';
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(D.salt), iterations: D.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(D.iv) }, key, bytes(D.data));
  const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
}
const msg = document.getElementById('msg'), go = document.getElementById('go');
async function tryPw(pw, remember) {
  if (!window.DecompressionStream) { msg.textContent = 'This browser is too old to open the team page. Please update it (iPhone/iPad: iOS 16.4 or newer).'; return; }
  go.disabled = true; msg.style.color = 'var(--muted)'; msg.textContent = 'Opening…';
  try {
    await unlock(pw);
    try { remember ? localStorage.setItem(KEY, pw) : localStorage.removeItem(KEY); } catch (e) {}
  } catch (e) {
    try { localStorage.removeItem(KEY); } catch (e2) {}
    go.disabled = false; msg.style.color = ''; msg.textContent = 'That password didn\'t work.';
  }
}
const eye = document.getElementById('eye'), pwIn = document.getElementById('pw');
eye.addEventListener('click', () => {
  const show = pwIn.type === 'password';
  pwIn.type = show ? 'text' : 'password';
  eye.setAttribute('aria-pressed', show); eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); eye.title = eye.getAttribute('aria-label');
  pwIn.focus();
});
document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); tryPw(document.getElementById('pw').value, document.getElementById('rem').checked); });
let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
if (saved) tryPw(saved, true);
