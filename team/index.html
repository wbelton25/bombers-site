const KEY = 'bombers-team-pw';
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
// Try every slot at once; whichever password slot opens gives the page key (and says whether it's the admin one).
async function openSlot(pw, s) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const wrap = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(s.salt), iterations: D.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);

async function unlock(pw) {
