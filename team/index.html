<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#141a2b;--muted:#5d667a;--line:#e3e7f0;--brand:#0a2a63;--bad:#c2372d;color-scheme:light}
html.dark{--bg:#0e1320;--card:#161d2f;--ink:#e8ecf5;--muted:#9aa4ba;--line:#26304a;--brand:#2a5298;--bad:#ff6b5e;color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;box-sizing:border-box}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:360px}
h1{font-size:1.2rem;margin:0 0 4px}p{margin:0 0 14px;color:var(--muted);font-size:.9rem}
.pwbox{position:relative}
#pw{width:100%;box-sizing:border-box;font:inherit;padding:10px 46px 10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0}
#eye svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#eye[aria-pressed="true"]{color:var(--brand)}#eye[aria-pressed="true"] .slash{display:none}
label{display:flex;gap:8px;align-items:center;margin:12px 0;font-size:.9rem;color:var(--muted)}
button{width:100%;font:inherit;font-weight:700;padding:10px;border:0;border-radius:9px;background:var(--brand);color:#fff;cursor:pointer}
#msg{min-height:1.3em;margin:10px 0 0;font-size:.85rem;color:var(--bad)}
a{color:inherit}

const KEY = 'bombers-team-pw';
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(D.salt), iterations: D.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(D.iv) }, key, bytes(D.data));
  const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
}
const msg = document.getElementById('msg'), go = document.getElementById('go');
async function tryPw(pw, remember) {
  if (!window.DecompressionStream) { msg.textContent = 'This browser is too old to open the team page. Please update it (iPhone/iPad: iOS 16.4 or newer).'; return; }
  go.disabled = true; msg.style.color = 'var(--muted)'; msg.textContent = 'Opening…';
  try {
    await unlock(pw);
    try { remember ? localStorage.setItem(KEY, pw) : localStorage.removeItem(KEY); } catch (e) {}
  } catch (e) {
    try { localStorage.removeItem(KEY); } catch (e2) {}
    go.disabled = false; msg.style.color = ''; msg.textContent = 'That password didn\'t work.';
  }
}

});
