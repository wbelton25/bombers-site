const KEY = 'bombers-team-pw';
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
// Try every slot at once; whichever password slot opens gives the page key (and says whether it's the admin one).
async function openSlot(pw, s) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const wrap = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(s.salt), iterations: D.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(s.iv) }, wrap, bytes(s.key));
  return { key: await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']), role: s.role };
}
async function unlock(pw) {
  const { key, role } = await Promise.any(D.slots.map(s => openSlot(pw, s)));
  try { role === 'admin' ? localStorage.setItem('bombers-admin', pw) : localStorage.removeItem('bombers-admin'); } catch (e) {}
  const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(D.iv) }, key, bytes(D.data));

}
const msg = document.getElementById('msg'), go = document.getElementById('go');
async function tryPw(pw, remember) {

  go.disabled = true; msg.style.color = 'var(--muted)'; msg.textContent = 'Opening…';
  try {
